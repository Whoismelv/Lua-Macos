name: mac-smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ui deps
        run: |
          python3 -m pip install --quiet "pywebview>=5.0"
          python3 -c "import webview, importlib.metadata as m; print('pywebview', m.version('pywebview'))"
          test -f ui/index.html
      - name: vdf parser fixture
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("lt", "luatools_mac.py")
          lt = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(lt)

          body = '''"620"
          {
              "appid"     "620"
              "common" { "name" "Portal 2" }
              "depots"
              {
                  "branches" { "public" { "buildid" "25240193" } }
                  "623" { "config" "oslist macos" "manifests" { "public" { "gid" "2276453204441793614" } } }
                  "660" { "config" "oslist windows" "manifests" { "public" { "gid" "2679694482538379167" } } }
              }
          }
          '''
          head_cut = "steamcmd banner\n" + "\n".join(body.splitlines()[2:]) + "\nRestarting steamcmd...\n"
          for label, blob in (("full", body), ("head-cut", head_cut),
                              ("nested", '"appinfo"\n{\n' + body + '}\n')):
              app = lt._extract_appinfo(blob, "620")
              assert app, label
              assert app["depots"]["branches"]["public"]["buildid"] == "25240193", label
              assert app["depots"]["623"]["config"] == "oslist macos", label
          print("vdf parser ok")
          PY
      - name: licensetools selftest
        run: |
          python3 -m py_compile licensetools_mac.py
          python3 licensetools_mac.py --selftest
          python3 licensetools_mac.py loader status
      - name: licensetools fetch smoke
        run: |
          set -o pipefail
          python3 licensetools_mac.py probe 480 --os mac --csv /tmp/lic-depots.csv || echo "probe returned non-zero"
          cat /tmp/lic-depots.csv 2>/dev/null || echo "no csv"
          python3 licensetools_mac.py fetch 480 --os mac --out /tmp/lic-games
          find /tmp/lic-games -type f | head -20
          test -n "$(find /tmp/lic-games -type f | head -1)"
      - name: macsteam injector smoke
        run: |
          python3 - <<'PY'
          import importlib.util, plistlib, subprocess, sys, tempfile
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("lt", "licensetools_mac.py")
          lt = importlib.util.module_from_spec(spec); spec.loader.exec_module(lt)
          app = Path("/Applications/Steam.app")
          if app.exists():
              print("real Steam present - skipping synthetic bundle")
              sys.exit(0)
          (app / "Contents" / "MacOS").mkdir(parents=True, exist_ok=True)
          exe = app / "Contents" / "MacOS" / "steam_osx"
          exe.write_text("#!/bin/sh\nexit 0\n"); exe.chmod(0o755)
          (app / "Contents" / "Info.plist").write_bytes(plistlib.dumps({
              "CFBundleExecutable": "steam_osx",
              "CFBundleIdentifier": "com.valvesoftware.steam",
              "CFBundleName": "Steam",
          }))
          tmp = Path(tempfile.mkdtemp())
          dylib = tmp / "macsteam.dylib"
          subprocess.run(["clang", "-dynamiclib", "-o", str(dylib), "-x", "c", "-"],
                         input=b"int macsteam_probe(void){return 1;}\n", check=True)
          sigs = tmp / "signatures" / "macos.arm64"
          sigs.mkdir(parents=True)
          (sigs / "1.json").write_text('{"schema_version":1,"profile_version":1,"steam_build":1,"signatures":[]}')
          res = lt.macsteam_inject(dylib, [tmp / "signatures"])
          print("inject:", res)
          assert res.get("ok"), res
          st = lt.macsteam_status()
          print("status:", st)
          assert st["injected"], st
          sig_dir = Path.home() / "Library/Application Support/macsteam/signatures/macos.arm64"
          assert sig_dir.is_dir() and list(sig_dir.glob("*.json")), "signature dir missing"
          print("signatures deployed:", [p.name for p in sig_dir.glob("*.json")])
          cfg = lt.macsteam_config_add(480)
          print("config:", cfg)
          assert cfg.get("ok"), cfg
          print((Path.home() / "Library/Application Support/macsteam/config.yaml").read_text())
          print("macsteam injector ok")
          import shutil
          shutil.rmtree(app, ignore_errors=True)
          shutil.rmtree(Path.home() / "Library/Application Support/macsteam", ignore_errors=True)
          print("synthetic bundle cleaned")
          PY
      - name: diagnostics
        run: |
          set -o pipefail
          {
            echo "## mac-smoke"
            echo '```'
            uname -a; python3 -VV
            echo "--- help"; python3 luatools_mac.py --help | head -5
            echo "--- detect"; python3 luatools_mac.py detect
            echo "--- library"; python3 luatools_mac.py library | head -12
            echo "--- install-dd"; python3 luatools_mac.py install-dd
            echo "--- brew steamcmd"; brew install --cask steamcmd
            echo "--- probe 620"; python3 luatools_mac.py probe 620 --out /tmp/depots.csv || echo "probe returned non-zero"
            echo "--- depots"; cat /tmp/depots.csv 2>/dev/null || echo "no depot csv"
            echo "--- fetch 480"; python3 luatools_mac.py fetch-game 480 auto --out /tmp/games
            echo "--- files"; find /tmp/games -type f | head -20
            echo "--- gui import"; python3 -c "import importlib.util as u; s=u.spec_from_file_location('g','luatools_mac_gui.py'); m=u.module_from_spec(s); s.loader.exec_module(m); print('gui ok')"
            echo "--- gui window"; python3 luatools_mac_gui.py --selftest; echo "gui_exit=$?"
            echo '```'
          } | tee /tmp/smoke.log
          {
            echo "## mac-smoke results"
            echo '```'
            grep -E "vdf parser ok|gui ok|gui_exit|Downloaded [0-9]+ bytes|,mac," /tmp/smoke.log | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$(find /tmp/games -type f 2>/dev/null | head -1)" ]; then
            echo "legacy fetch-game produced files"
          else
            echo "::warning::legacy fetch-game produced no files this run (diagnostic only - the licensetools fetch smoke above is the gate)"
          fi
          if [ -s /tmp/depots.csv ]; then
            grep -q ',mac,' /tmp/depots.csv || echo "::warning::probe returned no mac depot row"
          else
            echo "::warning::probe produced no csv this run (steamcmd anonymous login flake)"
          fi

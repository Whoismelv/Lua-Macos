name: mac-smoke

on:
  push:
    branches: [main]
    paths-ignore: ["ci-smoke.log"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: diagnostics
        run: |
          set +e
          exec > >(tee ci-smoke.log) 2>&1
          echo "RUN=$GITHUB_RUN_ID SHA=$GITHUB_SHA DATE=$(date -u +%FT%TZ)"
          echo "== uname =="; uname -a; python3 -VV
          echo "== help =="; python3 luatools_mac.py --help
          echo "== detect =="; python3 luatools_mac.py detect
          echo "== library =="; python3 luatools_mac.py library | head -20
          echo "== install-dd =="; python3 luatools_mac.py install-dd
          echo "== brew steamcmd =="; brew install --cask steamcmd; echo "brew_exit=$?"
          which steamcmd; ls -l /opt/homebrew/bin/steamcmd 2>/dev/null
          echo "== probe 620 =="; python3 luatools_mac.py probe 620 --out /tmp/depots.csv; echo "probe_exit=$?"
          echo "== csv =="; cat /tmp/depots.csv 2>/dev/null
          echo "== fetch 480 =="; python3 luatools_mac.py fetch-game 480 auto --out /tmp/games; echo "fetch_exit=$?"
          echo "== files =="; find /tmp/games -type f 2>/dev/null | head -20
          echo "== done =="
          test -n "$(find /tmp/games -type f 2>/dev/null | head -1)"
      - name: publish log
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-smoke.log || true
          git commit -m "ci: smoke log $GITHUB_RUN_ID [skip ci]" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

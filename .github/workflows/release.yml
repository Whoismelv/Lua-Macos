name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build app + dmg
        run: bash build_macos.sh
      - name: build licensetools dmg
        run: bash build_licensetools.sh
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LuaToolsMac.dmg
            dist/LicenseTools.dmg
          generate_release_notes: true
          name: LuaTools Mac ${{ github.ref_name }}

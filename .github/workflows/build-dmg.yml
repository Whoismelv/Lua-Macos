name: build-dmg

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: free disk
        run: |
          df -h /
          rm -rf "$HOME/.cache/pip" "$HOME/Library/Caches/pip" "$HOME/.npm"
          df -h /
      - name: build app + dmg
        run: bash build_macos.sh
      - name: prune disk
        run: |
          rm -rf build dmg-stage* dist/*.app build-lic .build-venv "$HOME/.cache/pip"
          df -h /
      - name: build licensetools dmg
        run: bash build_licensetools.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LuaToolsMac-dmg
          path: dist/LuaToolsMac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: LicenseTools-dmg
          path: dist/LicenseTools.dmg
